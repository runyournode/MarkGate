# ---------------------------------------------------------------------------
# Docling — docling-serve-plus air-gap deployment (deploiement-airgap/)
# ---------------------------------------------------------------------------
# Runs externally (its own docker compose, docling-serve published on port 5001) — reached via the
# docling-serve host-gateway alias declared in compose.yaml's extra_hosts. Every preset is named
# explicitly and must exist in that deployment's mount_config/docling/docling-serve.yaml; image
# description goes through its "description" preset (OpenAI-compatible endpoint configured there).
# Asynchronous API (/v1/convert/file/async + status polling): long documents exceed docling-serve's
# 120 s synchronous limit.

[backends.docling-standard]
backend_type = "docling"
description = "Docling standard pipeline — heron-101 layout, nemotron OCR, CodeFormula, image description"
upstream_url = "http://docling-serve:5001"
authorized_api_key = "${CLIENT_API_KEY_DOCLING_STANDARD}"
poll_interval_s = 0.5
max_wait_s = 3600

# Only if api_key is set in the deployment's docling-serve.yaml:
# [backends.docling-standard.custom_headers]
# X-Api-Key = "${UPSTREAM_DOCLING_API_KEY}"

[backends.docling-standard.query_params]
to_formats = ["md"]
# pictures returned inline by docling, then extracted and named after their content like foil's
# (imgs/<sha16>.png): served, cached in S3 and available through POST /images (engine "docling")
image_export_mode = "embedded"
include_images = true
pipeline = "standard"
layout_preset = "heron_101"
do_ocr = true
force_ocr = false
ocr_preset = "nemotron_ocr_remote"
do_table_structure = true
table_structure_preset = "tableformer_v1_accurate"
do_formula_enrichment = true
code_formula_preset = "codeformulav2_remote"
do_picture_description = true
picture_description_preset = "description"
picture_description_area_threshold = 0.01


[backends.docling-vlm]
backend_type = "docling"
description = "Docling VLM pipeline — dots.mocr, image description"
upstream_url = "http://docling-serve:5001"
authorized_api_key = "${CLIENT_API_KEY_DOCLING_VLM}"
poll_interval_s = 0.5
max_wait_s = 3600

# Only if api_key is set in the deployment's docling-serve.yaml:
# [backends.docling-vlm.custom_headers]
# X-Api-Key = "${UPSTREAM_DOCLING_API_KEY}"

# Formula enrichment has no effect in the VLM pipeline: dots.mocr writes LaTeX itself.
[backends.docling-vlm.query_params]
to_formats = ["md"]
# pictures returned inline by docling, then extracted and named after their content like foil's
# (imgs/<sha16>.png): served, cached in S3 and available through POST /images (engine "docling")
image_export_mode = "embedded"
include_images = true
pipeline = "vlm"
vlm_pipeline_preset = "dots_mocr"
do_picture_description = true
picture_description_preset = "description"
picture_description_area_threshold = 0.01


# ---------------------------------------------------------------------------
# xberg — native /extract endpoint, Markdown output forced
# ---------------------------------------------------------------------------
# Runs externally on the host (like foil-serve, not a docker compose service) — reached via the
# xberg-serve host-gateway alias declared in compose.yaml's extra_hosts.

[backends.xberg]
backend_type = "xberg"
description = "xberg — native /extract endpoint, markdown output"
upstream_url = "http://xberg-serve:8083/extract"
authorized_api_key = "${CLIENT_API_KEY_XBERG}"

# No auth confirmed required by the current dev instance (OpenAPI securitySchemes: null) — omit
# custom_headers for now. Uncomment if a deployment adds auth:
# [backends.xberg.custom_headers]
# Authorization = "Bearer ${UPSTREAM_XBERG_API_KEY}"

# Light processing only: MarkGate wants raw/fast extraction, not xberg's full
# document-understanding pipeline. disable_ocr alone guarantees no OCR regardless of ocr/
# force_ocr (left unset). Other heavy features (chunking, structured_extraction, ner, redaction,
# summarization, translation, page_classification, chunk_classification, captioning, qr_codes)
# are opt-in add-ons in xberg — left unset, relying on xberg's own default of not running them.
[backends.xberg.query_params]
disable_ocr = true
enable_quality_processing = false
use_layout_for_markdown = false
include_document_structure = false